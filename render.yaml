services:
  - type: web
    name: marketsentry-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/sync/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
